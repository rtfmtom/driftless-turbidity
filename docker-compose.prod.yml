# Production overrides layered on top of docker-compose.yml.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# We use the Compose Spec `!reset` tag to clear list fields from the base
# file before setting our own. Without it, compose merges lists and the
# dev-mode 0.0.0.0 port bindings leak into prod.

services:
  db:
    # Postgres stays on the internal Docker network only.
    ports: !reset []

  api:
    ports: !override
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes: !reset []
    environment:
      DRIFTLESS_DEV: "0"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://clarity.rtfmtom.com}

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time. An empty value
        # gets treated as unset (lib/api.ts then falls back to the dev
        # default `http://localhost:8000`, which leaks into the bundle),
        # so set the absolute prod URL explicitly. Same-origin → Caddy
        # routes /api/* to the api container; no CORS preflight needed.
        NEXT_PUBLIC_API_URL: "https://clarity.rtfmtom.com"
    ports: !override
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes: !reset []
    environment:
      NODE_ENV: production
      # Server-side fetches in Next.js (SSR) use this at runtime. Match
      # the build-time value so SSR and client agree on the base URL.
      NEXT_PUBLIC_API_URL: "https://clarity.rtfmtom.com"
    command: ["npm", "run", "start"]
