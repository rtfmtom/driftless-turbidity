[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftless"
version = "0.1.0"
description = "Driftless Clarity Dashboard API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "geoalchemy2>=0.14",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "dataretrieval>=1.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    # Geospatial — Phase 2 basin delineation.
    "shapely>=2.0",
    "pyproj>=3.6",
    "geopandas>=0.14",
    "pynhd>=0.16",
    # Basin characterization (Chunk 2c): NLCD land cover + gNATSGO soils + 3DEP DEM.
    "pygeohydro>=0.16",
    "py3dep>=0.16",
    # gNATSGO is now served via Microsoft Planetary Computer STAC, which
    # pygeohydro accesses through these two clients.
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    # Rainfall ingest — Phase 2b MRMS GRIB2 from s3://noaa-mrms-pds.
    "boto3>=1.34",
    "xarray>=2024.1",
    "rioxarray>=0.15",
    "cfgrib>=0.9.10",
    "eccodes>=2.35",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
driftless-ingest-usgs = "driftless.ingest.usgs:main"

[tool.hatch.build.targets.wheel]
packages = ["src/driftless"]

[tool.ruff]
line-length = 100
target-version = "py312"
