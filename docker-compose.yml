services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-driftless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driftless}
      POSTGRES_DB: ${POSTGRES_DB:-driftless}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-driftless} -d ${POSTGRES_DB:-driftless}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://driftless:driftless@db:5432/driftless}
      INGEST_ENABLED: ${INGEST_ENABLED:-true}
      INGEST_INTERVAL_MINUTES: ${INGEST_INTERVAL_MINUTES:-15}
      DRIFTLESS_DEV: ${DRIFTLESS_DEV:-1}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-driftless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driftless}
      POSTGRES_DB: ${POSTGRES_DB:-driftless}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api/src:/app/src
    command: ["api"]

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./web/app:/app/app
      - ./web/components:/app/components
      - ./web/lib:/app/lib
      - ./web/public:/app/public

volumes:
  pgdata:
